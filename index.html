<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subasta de cartas</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1b16;--mu:#6e695d;--bd:#ddd8cb;--ac:#b4472b;--ac2:#8a3320;--ok:#2d7a4b;--wn:#c98a00}
@media (prefers-color-scheme:dark){:root{--bg:#17150f;--card:#222018;--tx:#f1ede2;--mu:#a29c8b;--bd:#3a362a;--ac:#e0704f;--ac2:#f08a6a;--ok:#5fc283;--wn:#e8b23a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0 .1em}h2{font-size:1.1rem;margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,button,select{font:inherit;color:var(--tx)}
input[type=text],input[type=number],input[type=password],select{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;min-width:0}
button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:600}
button:hover{background:var(--ac2)}button:disabled{opacity:.45;cursor:not-allowed}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.sm{padding:5px 10px;font-size:.85rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.main-img{width:100%;aspect-ratio:3/4;max-height:460px;object-fit:contain;background:var(--bg);border-radius:10px;border:1px solid var(--bd)}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:7px;border:2px solid transparent;cursor:pointer}
.thumbs img.on{border-color:var(--ac)}
.price{font-size:2.4rem;font-weight:800;color:var(--ac)}
.timer{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ok);width:100%}
.log{max-height:190px;overflow-y:auto;border-top:1px solid var(--bd);margin-top:10px}
.log div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid var(--bd)}
.log div:first-child{font-weight:700;color:var(--ok)}
.adm-card{display:grid;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px}
.imgs{display:flex;gap:6px;flex-wrap:wrap}
.imgs span{position:relative}
.imgs img{width:60px;height:60px;object-fit:cover;border-radius:7px}
.imgs b{position:absolute;top:-6px;right:-6px;background:var(--ac);color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;font-size:.7rem;line-height:18px;cursor:pointer}
.lbl{font-size:.8rem;color:var(--mu);display:block}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd)}
.mem{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.modal>div{background:var(--card);border-radius:18px;padding:28px;text-align:center;max-width:420px;width:100%;border:3px solid var(--ac)}
.modal .w{font-size:1.8rem;font-weight:800;margin:8px 0}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <h1>🃏 Subasta de cartas</h1>
  <div id="status" class="mu">Conectando…</div>
  <div id="menu"></div>
  <div id="admin" class="hide"></div>
  <div id="members"></div>
  <div id="live"></div>
  <div id="report"></div>
</main>
<div class="modal" id="modal"><div><div class="mu">Ronda terminada</div><div class="w" id="mCard"></div><div>Ganador</div><div class="w" id="mWin" style="color:var(--ok)"></div><div class="price" id="mAmt"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, set, update, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyB9gq6dFliBmXep4AxXQBH-IB9MjPdZL2s",
  authDomain: "subastas-d3872.firebaseapp.com",
  databaseURL: "https://subastas-d3872-default-rtdb.firebaseio.com",
  projectId: "subastas-d3872",
  storageBucket: "subastas-d3872.firebasestorage.app",
  messagingSenderId: "14103613295",
  appId: "1:14103613295:web:d5f3394abbdac55e66629a"
});
const auth = getAuth(app), db = getDatabase(app);
const ADMIN_EMAIL = 'admin@subasta.com';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => '$' + Number(n || 0).toLocaleString('es-AR');
const arr = v => v ? (Array.isArray(v) ? v.filter(Boolean) : Object.values(v)) : [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = () => Math.random().toString(36).slice(2, 10);
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const dur = c => c && c.mode === 'palabra' ? (+c.secs || 30) * 1000 : 10000;
let offset = 0; const now = () => Date.now() + offset;

let role = null, isAdmin = false, myId = null, myName = '', C = null, L = null, players = [], imgs = {}, words = {}, playersLoaded = false;
let unsubs = [], adminSig = '', imgIdx = 0, lastBanner = 0, closing = false;
try { myName = localStorage.getItem('sub_name') || ''; } catch (e) {}
const me = () => players.find(p => p.id === myId);
const cardImgs = id => imgs[id] || [];

onValue(ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });

/* ---------- Sesión y suscripciones ---------- */
onAuthStateChanged(auth, user => {
  unsubs.forEach(f => f()); unsubs = []; C = L = null; players = []; imgs = {}; words = {}; playersLoaded = false; adminSig = '';
  $('#live').dataset.idx = ''; $('#members').dataset.sig = ''; $('#report').dataset.n = '';
  if (!user) { role = null; isAdmin = false; myId = null; render(); return; }
  myId = user.uid; isAdmin = user.email === ADMIN_EMAIL; role = isAdmin ? 'admin' : 'bidder';
  const err = e => { $('#status').textContent = 'Error de conexión: ' + (e.code || e.message) + ' (revisá las reglas de Firebase)'; };
  unsubs.push(onValue(ref(db, 'auction/config'), s => { const v = s.val() || {}; C = { status: 'setup', ...v, cards: arr(v.cards), results: arr(v.results) }; render(); }, err));
  unsubs.push(onValue(ref(db, 'auction/live'), s => { const v = s.val() || {}; L = { idx: 0, high: 0, highName: '', highId: '', endsAt: 0, bannerUntil: 0, ...v, bids: arr(v.bids) }; render(); }, err));
  unsubs.push(onValue(ref(db, 'players'), s => { const v = s.val() || {}; players = Object.entries(v).map(([id, p]) => ({ id, ...p })).sort((a, b) => (a.t || 0) - (b.t || 0)); playersLoaded = true; render(); }, err));
  unsubs.push(onValue(ref(db, 'images'), s => { const v = s.val() || {}; imgs = {}; for (const [cid, o] of Object.entries(v)) imgs[cid] = Object.entries(o || {}).map(([id, url]) => ({ id, url })); render(); }, err));
  if (isAdmin) unsubs.push(onValue(ref(db, 'secret/words'), s => { words = s.val() || {}; render(); }, err));
  render();
});
setInterval(() => tick(), 250);
render();

async function logout() {
  if (role === 'bidder' && myId) { try { await remove(ref(db, 'players/' + myId)); } catch (e) {} }
  await signOut(auth);
}

/* ---------- Menú inicial ---------- */
function hideMenu() { const m = $('#menu'); m.dataset.on = ''; m.innerHTML = ''; $('#live').classList.remove('hide'); $('#report').classList.remove('hide'); }
function showMenu() {
  $('#admin').classList.add('hide'); $('#live').classList.add('hide'); $('#report').classList.add('hide'); $('#status').textContent = ''; $('#members').innerHTML = ''; $('#members').dataset.sig = '';
  const m = $('#menu'); if (m.dataset.on) return; m.dataset.on = 1;
  m.innerHTML = `<div class="grid"><div class="card"><h2>🎤 Modo subastador</h2><div class="mu">Entrá con la palabra clave para cargar las cartas y manejar la subasta.</div>
    <div class="row" style="margin-top:10px"><input type="password" id="mpw" placeholder="Palabra clave" style="flex:1"><button id="mgo1">Entrar</button></div><div class="mu" id="mmsg1"></div></div>
    <div class="card"><h2>🙋 Modo pujador</h2><div class="mu">Elegí tu usuario para entrar a la sala y participar.</div>
    <div class="row" style="margin-top:10px"><input type="text" id="mnm" placeholder="Tu usuario" maxlength="24" value="${esc(myName)}" style="flex:1"><button id="mgo2">Entrar</button></div><div class="mu" id="mmsg2"></div></div></div>`;
  const go1 = async () => {
    const msg = $('#mmsg1'); msg.textContent = 'Verificando…';
    try { await signInWithEmailAndPassword(auth, ADMIN_EMAIL, $('#mpw').value.trim()); }
    catch (e) { msg.textContent = /credential|password|user-not-found|invalid/.test(e.code || '') ? 'Palabra clave incorrecta.' : 'No se pudo entrar: ' + (e.code || e.message); }
  };
  const go2 = () => join($('#mnm').value, $('#mmsg2'));
  $('#mgo1').onclick = go1; $('#mpw').addEventListener('keydown', e => { if (e.key === 'Enter') go1(); });
  $('#mgo2').onclick = go2; $('#mnm').addEventListener('keydown', e => { if (e.key === 'Enter') go2(); });
}

async function join(name, msg) {
  name = (name || '').trim();
  if (!name) { msg.textContent = 'Escribí un usuario.'; return false; }
  msg.textContent = 'Entrando…';
  try { if (!auth.currentUser) await signInAnonymously(auth); } catch (e) { msg.textContent = 'No se pudo conectar: ' + (e.code || e.message); return false; }
  myId = auth.currentUser.uid;
  for (let i = 0; i < 60 && !playersLoaded; i++) await sleep(100);
  if (!playersLoaded) { msg.textContent = 'Sin conexión con la base de datos. Revisá las reglas de Firebase.'; return false; }
  
  const existingPlayer = players.find(p => (p.name || '').toLowerCase() === name.toLowerCase());
  if (existingPlayer) {
    myId = existingPlayer.id;
  }

  try { await set(ref(db, 'players/' + myId), { name, t: existingPlayer ? existingPlayer.t : now() }); }
  catch (e) { msg.textContent = 'No se pudo entrar: ' + (e.code || e.message); return false; }
  
  if (!me()) players.push({ id: myId, name, t: existingPlayer ? existingPlayer.t : now() });
  myName = name; try { localStorage.setItem('sub_name', name); } catch (x) {}
  render(); return true;
}

/* ---------- Render general ---------- */
function render() {
  if (!role || (role === 'bidder' && playersLoaded && !me())) { showMenu(); return; }
  if (!C || !L) return;
  hideMenu();
  $('#status').innerHTML = (isAdmin ? 'Modo subastador' : 'Modo pujador: <b>' + esc(me() ? me().name : myName) + '</b>') + ' · <a href="#" id="logout" style="color:var(--ac)">Salir</a>';
  $('#logout').onclick = ev => { ev.preventDefault(); logout(); };
  const sig = JSON.stringify([C.cards, C.status, imgs, words]);
  if (isAdmin) { $('#admin').classList.remove('hide'); if (sig !== adminSig) { adminSig = sig; renderAdmin(); } } else $('#admin').classList.add('hide');
  renderMembers(); renderLive(); renderReport(); checkBanner();
}

/* ---------- Subastador ---------- */
const setCards = cards => set(ref(db, 'auction/config/
