<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subasta de cartas</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1b16;--mu:#6e695d;--bd:#ddd8cb;--ac:#b4472b;--ac2:#8a3320;--ok:#2d7a4b;--wn:#c98a00}
@media (prefers-color-scheme:dark){:root{--bg:#17150f;--card:#222018;--tx:#f1ede2;--mu:#a29c8b;--bd:#3a362a;--ac:#e0704f;--ac2:#f08a6a;--ok:#5fc283;--wn:#e8b23a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0 .1em}h2{font-size:1.1rem;margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,button,select{font:inherit;color:var(--tx)}
input[type=text],input[type=number],input[type=password],select{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;min-width:0}
button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:600}
button:hover{background:var(--ac2)}button:disabled{opacity:.45;cursor:not-allowed}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.sm{padding:5px 10px;font-size:.85rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.main-img{width:100%;aspect-ratio:3/4;max-height:460px;object-fit:contain;background:var(--bg);border-radius:10px;border:1px solid var(--bd)}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:7px;border:2px solid transparent;cursor:pointer}
.thumbs img.on{border-color:var(--ac)}
.price{font-size:2.4rem;font-weight:800;color:var(--ac)}
.timer{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ok);width:100%}
.log{max-height:190px;overflow-y:auto;border-top:1px solid var(--bd);margin-top:10px}
.log div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid var(--bd)}
.log div:first-child{font-weight:700;color:var(--ok)}
.adm-card{display:grid;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px}
.imgs{display:flex;gap:6px;flex-wrap:wrap}
.imgs span{position:relative}
.imgs img{width:60px;height:60px;object-fit:cover;border-radius:7px}
.imgs b{position:absolute;top:-6px;right:-6px;background:var(--ac);color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;font-size:.7rem;line-height:18px;cursor:pointer}
.lbl{font-size:.8rem;color:var(--mu);display:block}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd)}
.mem{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.modal>div{background:var(--card);border-radius:18px;padding:28px;text-align:center;max-width:420px;width:100%;border:3px solid var(--ac)}
.modal .w{font-size:1.8rem;font-weight:800;margin:8px 0}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <h1>🃏 Subasta de cartas</h1>
  <div id="status" class="mu">Conectando…</div>
  <div id="menu"></div>
  <div id="admin" class="hide"></div>
  <div id="members"></div>
  <div id="live"></div>
  <div id="report"></div>
</main>
<div class="modal" id="modal"><div><div class="mu">Ronda terminada</div><div class="w" id="mCard"></div><div>Ganador</div><div class="w" id="mWin" style="color:var(--ok)"></div><div class="price" id="mAmt"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, set, update, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyB9gq6dFliBmXep4AxXQBH-IB9MjPdZL2s",
  authDomain: "subastas-d3872.firebaseapp.com",
  databaseURL: "https://subastas-d3872-default-rtdb.firebaseio.com",
  projectId: "subastas-d3872",
  storageBucket: "subastas-d3872.firebasestorage.app",
  messagingSenderId: "14103613295",
  appId: "1:14103613295:web:d5f3394abbdac55e66629a"
});
const auth = getAuth(app), db = getDatabase(app);
const ADMIN_EMAIL = 'admin@subasta.com';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => '$' + Number(n || 0).toLocaleString('es-AR');
const arr = v => v ? (Array.isArray(v) ? v.filter(Boolean) : Object.values(v)) : [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = () => Math.random().toString(36).slice(2, 10);
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const dur = c => c && c.mode === 'palabra' ? (+c.secs || 30) * 1000 : 10000;
let offset = 0; const now = () => Date.now() + offset;

let role = null, isAdmin = false, myId = null, myName = '', C = null, L = null, players = [], imgs = {}, words = {}, playersLoaded = false;
let unsubs = [], adminSig = '', imgIdx = 0, lastBanner = 0, closing = false;
try { myName = localStorage.getItem('sub_name') || ''; } catch (e) {}
const me = () => players.find(p => p.id === myId);
const cardImgs = id => imgs[id] || [];

onValue(ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });

/* ---------- Sesión y suscripciones ---------- */
onAuthStateChanged(auth, user => {
  unsubs.forEach(f => f()); unsubs = []; C = L = null; players = []; imgs = {}; words = {}; playersLoaded = false; adminSig = '';
  $('#live').dataset.idx = ''; $('#members').dataset.sig = ''; $('#report').dataset.n = '';
  if (!user) { role = null; isAdmin = false; myId = null; render(); return; }
  myId = user.uid; isAdmin = user.email === ADMIN_EMAIL; role = isAdmin ? 'admin' : 'bidder';
  const err = e => { $('#status').textContent = 'Error de conexión: ' + (e.code || e.message) + ' (revisá las reglas de Firebase)'; };
  unsubs.push(onValue(ref(db, 'auction/config'), s => { const v = s.val() || {}; C = { status: 'setup', ...v, cards: arr(v.cards), results: arr(v.results) }; render(); }, err));
  unsubs.push(onValue(ref(db, 'auction/live'), s => { const v = s.val() || {}; L = { idx: 0, high: 0, highName: '', highId: '', endsAt: 0, bannerUntil: 0, ...v, bids: arr(v.bids) }; render(); }, err));
  unsubs.push(onValue(ref(db, 'players'), s => { const v = s.val() || {}; players = Object.entries(v).map(([id, p]) => ({ id, ...p })).sort((a, b) => (a.t || 0) - (b.t || 0)); playersLoaded = true; render(); }, err));
  unsubs.push(onValue(ref(db, 'images'), s => { const v = s.val() || {}; imgs = {}; for (const [cid, o] of Object.entries(v)) imgs[cid] = Object.entries(o || {}).map(([id, url]) => ({ id, url })); render(); }, err));
  if (isAdmin) unsubs.push(onValue(ref(db, 'secret/words'), s => { words = s.val() || {}; render(); }, err));
  render();
});
setInterval(() => tick(), 250);
render();

async function logout() {
  if (role === 'bidder' && myId) { try { await remove(ref(db, 'players/' + myId)); } catch (e) {} }
  await signOut(auth);
}

/* ---------- Menú inicial ---------- */
function hideMenu() { const m = $('#menu'); m.dataset.on = ''; m.innerHTML = ''; $('#live').classList.remove('hide'); $('#report').classList.remove('hide'); }
function showMenu() {
  $('#admin').classList.add('hide'); $('#live').classList.add('hide'); $('#report').classList.add('hide'); $('#status').textContent = ''; $('#members').innerHTML = ''; $('#members').dataset.sig = '';
  const m = $('#menu'); if (m.dataset.on) return; m.dataset.on = 1;
  m.innerHTML = `<div class="grid"><div class="card"><h2>🎤 Modo subastador</h2><div class="mu">Entrá con la palabra clave para cargar las cartas y manejar la subasta.</div>
    <div class="row" style="margin-top:10px"><input type="password" id="mpw" placeholder="Palabra clave" style="flex:1"><button id="mgo1">Entrar</button></div><div class="mu" id="mmsg1"></div></div>
    <div class="card"><h2>🙋 Modo pujador</h2><div class="mu">Elegí tu usuario para entrar a la sala y participar.</div>
    <div class="row" style="margin-top:10px"><input type="text" id="mnm" placeholder="Tu usuario" maxlength="24" value="${esc(myName)}" style="flex:1"><button id="mgo2">Entrar</button></div><div class="mu" id="mmsg2"></div></div></div>`;
  const go1 = async () => {
    const msg = $('#mmsg1'); msg.textContent = 'Verificando…';
    try { await signInWithEmailAndPassword(auth, ADMIN_EMAIL, $('#mpw').value.trim()); }
    catch (e) { msg.textContent = /credential|password|user-not-found|invalid/.test(e.code || '') ? 'Palabra clave incorrecta.' : 'No se pudo entrar: ' + (e.code || e.message); }
  };
  const go2 = () => join($('#mnm').value, $('#mmsg2'));
  $('#mgo1').onclick = go1; $('#mpw').addEventListener('keydown', e => { if (e.key === 'Enter') go1(); });
  $('#mgo2').onclick = go2; $('#mnm').addEventListener('keydown', e => { if (e.key === 'Enter') go2(); });
}

async function join(name, msg) {
  name = (name || '').trim();
  if (!name) { msg.textContent = 'Escribí un usuario.'; return false; }
  msg.textContent = 'Entrando…';
  try { if (!auth.currentUser) await signInAnonymously(auth); } catch (e) { msg.textContent = 'No se pudo conectar: ' + (e.code || e.message); return false; }
  myId = auth.currentUser.uid;
  for (let i = 0; i < 60 && !playersLoaded; i++) await sleep(100);
  if (!playersLoaded) { msg.textContent = 'Sin conexión con la base de datos. Revisá las reglas de Firebase.'; return false; }
  if (players.some(p => p.id !== myId && (p.name || '').toLowerCase() === name.toLowerCase())) { msg.textContent = 'Ese usuario ya está en uso, elegí otro.'; return false; }
  try { await set(ref(db, 'players/' + myId), { name, t: now() }); }
  catch (e) { msg.textContent = 'No se pudo entrar: ' + (e.code || e.message); return false; }
  if (!me()) players.push({ id: myId, name, t: now() });
  myName = name; try { localStorage.setItem('sub_name', name); } catch (x) {}
  render(); return true;
}

/* ---------- Render general ---------- */
function render() {
  if (!role || (role === 'bidder' && playersLoaded && !me())) { showMenu(); return; }
  if (!C || !L) return;
  hideMenu();
  $('#status').innerHTML = (isAdmin ? 'Modo subastador' : 'Modo pujador: <b>' + esc(me() ? me().name : myName) + '</b>') + ' · <a href="#" id="logout" style="color:var(--ac)">Salir</a>';
  $('#logout').onclick = ev => { ev.preventDefault(); logout(); };
  const sig = JSON.stringify([C.cards, C.status, imgs, words]);
  if (isAdmin) { $('#admin').classList.remove('hide'); if (sig !== adminSig) { adminSig = sig; renderAdmin(); } } else $('#admin').classList.add('hide');
  renderMembers(); renderLive(); renderReport(); checkBanner();
}

/* ---------- Subastador ---------- */
const setCards = cards => set(ref(db, 'auction/config/cards'), cards);
const cloneCards = () => C.cards.map(c => ({ ...c }));

function renderAdmin() {
  const el = $('#admin'), setup = C.status === 'setup';
  let h = `<div class="card"><h2>Panel del subastador</h2>`;
  if (setup) {
    h += `<div class="mu">Cargá las cartas en el orden en que se subastan. Podés subir varias fotos por carta.</div>`;
    C.cards.forEach((c, i) => {
      h += `<div class="adm-card"><div class="row"><b>#${i + 1}</b>
        <input type="text" value="${esc(c.name)}" placeholder="Nombre de la carta" data-f="name" data-i="${i}" style="flex:1;min-width:150px">
        <button class="sec sm" data-act="up" data-i="${i}">↑</button><button class="sec sm" data-act="dn" data-i="${i}">↓</button><button class="sec sm" data-act="del" data-i="${i}">Quitar</button></div>
        <div class="row"><label><span class="lbl">Tipo</span><select data-f="mode" data-i="${i}"><option value="puja" ${c.mode === 'palabra' ? '' : 'selected'}>Subasta por puja</option><option value="palabra" ${c.mode === 'palabra' ? 'selected' : ''}>Gana el primero que escriba una palabra</option></select></label>
        <label><span class="lbl">${c.mode === 'palabra' ? 'Precio que paga el ganador' : 'Precio mínimo'}</span><input type="number" min="0" value="${c.min}" data-f="min" data-i="${i}" style="width:120px"></label>
        ${c.mode === 'palabra' ? `<label><span class="lbl">Palabra secreta</span><input type="text" value="${esc(words[c.id] || '')}" data-f="word" data-i="${i}" style="width:160px"></label><label><span class="lbl">Tiempo límite (seg)</span><input type="number" min="5" value="${c.secs || 30}" data-f="secs" data-i="${i}" style="width:100px"></label>` : `<label><span class="lbl">Puja mínima (incremento)</span><input type="number" min="1" value="${c.step}" data-f="step" data-i="${i}" style="width:120px"></label>`}</div>
        <div class="imgs">${cardImgs(c.id).map(m => `<span><img src="${esc(m.url)}" alt=""><b data-act="rmimg" data-i="${i}" data-k="${esc(m.id)}">×</b></span>`).join('')}</div>
        <label class="lbl">Agregar fotos (podés elegir varias) <input type="file" accept="image/*" multiple data-act="upload" data-i="${i}"></label></div>`;
    });
    h += `<div class="row" style="margin-top:12px"><button data-act="add">+ Agregar carta</button>
      <button data-act="start" ${C.cards.length ? '' : 'disabled'} style="background:var(--ok)">▶ Iniciar subasta</button></div>`;
  } else {
    h += `<div class="row"><span>Subasta ${C.status === 'running' ? 'en curso' : 'finalizada'}.</span><button class="sec" data-act="reset">Reiniciar todo (volver a cargar cartas)</button></div>`;
  }
  el.innerHTML = h + '</div>';
}

function shrink(file, max = 720) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.72)); };
    img.onerror = rej; img.src = u;
  });
}

$('#admin').addEventListener('change', async e => {
  const t = e.target, i = +t.dataset.i;
  if (t.dataset.f === 'word') { await set(ref(db, 'secret/words/' + C.cards[i].id), t.value.trim()); return; }
  if (t.dataset.f) { const f = t.dataset.f, cards = cloneCards(); cards[i][f] = (f === 'name' || f === 'mode') ? t.value : Math.max(0, +t.value || 0); await setCards(cards); }
  if (t.dataset.act === 'upload') {
    const cid = C.cards[i].id; t.disabled = true;
    for (const f of t.files) { try { await set(ref(db, `images/${cid}/${rid()}`), await shrink(f)); } catch (err) { $('#status').textContent = 'No se pudo subir ' + f.name + ': ' + (err.code || err.message); } }
  }
});
$('#admin').addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t || t.tagName === 'INPUT') return;
  const a = t.dataset.act, i = +t.dataset.i, cards = cloneCards();
  if (a === 'add') { cards.push({ id: rid(), name: '', mode: 'puja', min: 100, step: 10, secs: 30 }); await setCards(cards); }
  if (a === 'del') { const [x] = cards.splice(i, 1); await setCards(cards); remove(ref(db, 'images/' + x.id)); remove(ref(db, 'secret/words/' + x.id)); }
  if (a === 'up' && i > 0) { [cards[i - 1], cards[i]] = [cards[i], cards[i - 1]]; await setCards(cards); }
  if (a === 'dn' && i < cards.length - 1) { [cards[i + 1], cards[i]] = [cards[i], cards[i + 1]]; await setCards(cards); }
  if (a === 'rmimg') await remove(ref(db, `images/${cards[i].id}/${t.dataset.k}`));
  if (a === 'start') {
    cards.forEach((c, k) => { if (!c.name.trim()) c.name = 'Carta ' + (k + 1); });
    const bad = cards.find(c => c.mode === 'palabra' && !norm(words[c.id]));
    if (bad) { alert('Falta definir la palabra secreta de: ' + (bad.name || 'una carta')); return; }
    await update(ref(db), { 'auction/config/cards': cards, 'auction/config/status': 'running', 'auction/config/results': null, 'auction/config/last': null,
      'secret/word': cards[0].mode === 'palabra' ? norm(words[cards[0].id]) : null,
      'auction/live': { idx: 0, high: 0, highName: '', highId: '', endsAt: now() + dur(cards[0]), bannerUntil: 0 } });
  }
  if (a === 'reset' && !t.dataset.armed) { t.dataset.armed = 1; t.textContent = '¿Seguro? Tocá de nuevo para confirmar'; setTimeout(() => { delete t.dataset.armed; t.textContent = 'Reiniciar todo (volver a cargar cartas)'; }, 4000); return; }
  if (a === 'reset') await update(ref(db), { 'auction/config/status': 'setup', 'auction/config/results': null, 'auction/config/last': null, 'secret/word': null, 'auction/live': { idx: 0, high: 0, highName: '', highId: '', endsAt: 0, bannerUntil: 0 } });
});

function renderMembers() {
  const el = $('#members');
  if (!isAdmin) { el.innerHTML = ''; el.dataset.sig = ''; return; }
  const sig = JSON.stringify(players.map(p => [p.id, p.name]));
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  el.innerHTML = `<div class="card"><h2>👥 Integrantes (${players.length})</h2>` + (players.length
    ? players.map(p => `<div class="mem"><span>👤 ${esc(p.name)}</span><button class="sec sm" data-kick="${esc(p.id)}">Eliminar</button></div>`).join('')
    : '<div class="mu">Todavía no entró nadie.</div>') + '</div>';
}
$('#members').addEventListener('click', e => {
  const b = e.target.closest('[data-kick]'); if (!b) return;
  if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = '¿Seguro?'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Eliminar'; } }, 3000); return; }
  remove(ref(db, 'players/' + b.dataset.kick));
});

/* ---------- Vista en vivo ---------- */
const cur = () => C.cards[L.idx];
const minBid = () => L.high ? L.high + (+cur().step || 1) : (+cur().min || 0);

function renderLive() {
  const el = $('#live');
  if (C.status === 'setup') {
    const key = 'lobby';
    if (el.dataset.idx !== key) { el.dataset.idx = key; el.innerHTML = `<div class="card"><h2>🚪 Sala de espera</h2><div id="lmsg2"></div><h2 style="margin-top:16px">Participantes (<span id="lcnt"></span>)</h2><div id="plist"></div></div>`; }
    $('#lmsg2').textContent = isAdmin ? 'Esperá a que entren los participantes y tocá Iniciar subasta cuando estén listos.' : 'Estás dentro. Esperá a que el subastador inicie la subasta.';
    $('#lcnt').textContent = players.length;
    $('#plist').innerHTML = players.length ? players.map(p => `<div class="mem"><span>👤 ${esc(p.name)}${p.id === myId ? ' <span class="mu">(vos)</span>' : ''}</span></div>`).join('') : '<div class="mu">Todavía no entró nadie.</div>';
    return;
  }
  if (C.status === 'done') { el.dataset.idx = 'done'; el.innerHTML = `<div class="card"><h2>🏁 Subasta finalizada</h2><div class="mu">Gracias por participar.</div>${resultsTable()}</div>`; return; }
  const c = cur(); if (!c) return;
  const im = cardImgs(c.id);
  if (imgIdx >= im.length) imgIdx = 0;
  const key = L.idx + '|' + (c.mode || '') + '|' + im.map(m => m.id).join(',') + '|' + imgIdx;
  if (el.dataset.idx !== key) {
    el.dataset.idx = key;
    el.innerHTML = `<div class="card"><div class="mu">Carta ${L.idx + 1} de ${C.cards.length}</div><h2 style="font-size:1.4rem">${esc(c.name)}</h2>
    <div class="grid"><div>${im.length ? `<img class="main-img" src="${esc(im[imgIdx].url)}" alt="">` : `<div class="main-img" style="display:flex;align-items:center;justify-content:center">Sin foto</div>`}
      <div class="thumbs">${im.map((m, k) => `<img src="${esc(m.url)}" class="${k === imgIdx ? 'on' : ''}" data-k="${k}" alt="">`).join('')}</div></div>
    <div>
      <div class="mu">${c.mode === 'palabra' ? 'Gana el primero que escriba la palabra · Precio ' + fmt(c.min) : 'Precio mínimo ' + fmt(c.min) + ' · Puja mínima +' + fmt(c.step)}</div>
      <div class="mu" style="margin-top:8px">${c.mode === 'palabra' ? 'Ganador' : 'Puja más alta'}</div><div class="price" id="hp"></div><div id="hn" class="mu"></div>
      <div class="timer" id="tm"></div><div class="bar"><i id="tb"></i></div>
      <div id="bidbox"></div><div class="log" id="log"></div>
    </div></div></div>`;
    el.querySelector('.thumbs').addEventListener('click', e => { const k = e.target.dataset.k; if (k !== undefined) { imgIdx = +k; el.dataset.idx = ''; renderLive(); } });
  }
  if (c.mode === 'palabra') { $('#hp').textContent = L.winnerName ? '🏆 ' + L.winnerName : '—'; $('#hn').textContent = L.winnerName ? 'Se lleva la carta' + (L.winnerId === myId ? ' (¡fuiste vos!)' : '') : 'Aún nadie acertó'; }
  else { $('#hp').textContent = L.high ? fmt(L.high) : '—';
  $('#hn').textContent = L.high ? 'de ' + L.highName + (L.highId === myId ? ' (vos)' : '') : 'Aún sin pujas'; }
  $('#log').innerHTML = L.bids.map(b => `<div><span>${esc(b.name)}</span><span>${fmt(b.amount)}</span></div>`).join('');
  renderBidBox();
}

function renderBidBox() {
  const box = $('#bidbox'); if (!box) return;
  if (cur().mode === 'palabra') {
    if (isAdmin) { box.innerHTML = `<div class="mu">Modo subastador. Palabra secreta: <b>${esc(words[cur().id] || '(sin definir)')}</b></div>`; return; }
    if (!box.dataset.ok) {
      box.dataset.ok = 1;
      box.innerHTML = `<div class="mu">Escribí la palabra correcta. El primero en acertar se lleva la carta.</div><div class="row" style="margin-top:8px"><input type="text" id="wd" placeholder="La palabra…" style="flex:1" autocomplete="off"><button id="wgo">Enviar</button></div><div class="mu" id="msg"></div>`;
      $('#wgo').onclick = guessWord; $('#wd').addEventListener('keydown', e => { if (e.key === 'Enter') guessWord(); });
    }
    $('#wgo').disabled = $('#wd').disabled = !!L.winnerId;
    return;
  }
  if (isAdmin) { if (!box.dataset.adm) { box.dataset.adm = 1; box.innerHTML = '<div class="mu">Modo subastador: seguís la subasta en vivo.</div>'; } return; }
  const mb = minBid();
  if (!box.dataset.ok) {
    box.dataset.ok = 1;
    box.innerHTML = `<div class="mu">Pujás como <b>${esc(me() ? me().name : myName)}</b></div>
      <div class="row" style="margin-top:8px"><input type="number" id="amt" style="flex:1" inputmode="numeric"><button id="go">Pujar</button></div>
      <div class="row" style="margin-top:8px"><button class="sec sm" id="quick"></button></div><div class="mu" id="msg"></div>`;
    $('#go').onclick = () => bid(+$('#amt').value);
    $('#quick').onclick = () => bid(minBid());
    $('#amt').addEventListener('keydown', e => { if (e.key === 'Enter') bid(+e.target.value); });
  }
  const amt = $('#amt'); amt.min = mb; amt.placeholder = 'Mínimo ' + mb;
  if (document.activeElement !== amt && (!amt.value || +amt.value < mb)) amt.value = mb;
  $('#quick').textContent = 'Pujar mínimo ' + fmt(mb);
}

async function bid(v) {
  const msg = $('#msg'), idx = L.idx, c = cur(), name = me() ? me().name : myName;
  if (!(v >= minBid())) { msg.textContent = 'La puja debe ser de al menos ' + fmt(minBid()); return; }
  msg.textContent = '';
  try {
    const r = await runTransaction(ref(db, 'auction/live'), cl => {
      if (!cl) return;
      const t = now(), need = cl.high ? cl.high + (+c.step || 1) : (+c.min || 0);
      if (cl.idx !== idx || t >= cl.endsAt || t < (cl.bannerUntil || 0) || v < need) return;
      return { ...cl, high: v, highName: name, highId: myId, bids: [{ name, amount: v }, ...arr(cl.bids)].slice(0, 30), endsAt: t + 10000 };
    });
    if (!r.committed) msg.textContent = 'No se pudo registrar: alguien pujó antes o la ronda cerró.';
  } catch (e) { msg.textContent = 'Error al pujar: ' + (e.code || e.message); }
}

async function guessWord() {
  const msg = $('#msg'), idx = L.idx, g = norm($('#wd').value), name = me() ? me().name : myName;
  if (!g) return;
  try {
    const r = await runTransaction(ref(db, 'auction/live'), cl => {
      if (!cl) return;
      const t = now();
      if (cl.idx !== idx || cl.winnerId || t >= cl.endsAt || t < (cl.bannerUntil || 0)) return;
      return { ...cl, winnerId: myId, winnerName: name, guess: g, endsAt: t };
    });
    msg.textContent = r.committed ? '' : 'No acertaste o alguien llegó antes.';
  } catch (e) { msg.textContent = /permission/i.test((e.code || '') + (e.message || '')) ? 'Esa no es la palabra. Probá de nuevo.' : 'Error: ' + (e.code || e.message); }
  if ($('#wd')) $('#wd').value = '';
}

/* ---------- Temporizador y cierre ---------- */
function tick() {
  if (!C || !L || !role) return;
  const t = now(), tm = $('#tm'), tb = $('#tb');
  if (C.status === 'running' && tm) {
    if (t < L.bannerUntil) { tm.textContent = 'Próxima carta en ' + Math.ceil((L.bannerUntil - t) / 1000) + ' s'; tb.style.width = '0%'; }
    else { const left = Math.max(0, L.endsAt - t); tm.textContent = Math.ceil(left / 1000) + ' s'; tb.style.width = Math.min(100, left / 100) + '%'; tb.style.background = left < 3500 ? 'var(--wn)' : 'var(--ok)'; }
  }
  if (isAdmin && C.status === 'running' && t >= L.endsAt && t >= L.bannerUntil && !closing) closeRound();
  checkBanner();
}

async function closeRound() {
  closing = true;
  try {
    const c = cur(), t = now(), done = L.idx + 1 >= C.cards.length, next = done ? null : C.cards[L.idx + 1], w = c.mode === 'palabra';
    const res = w ? { n: L.idx + 1, card: c.name, mode: 'palabra', winner: L.winnerName || '', amount: L.winnerName ? (+c.min || 0) : 0 }
                  : { n: L.idx + 1, card: c.name, mode: 'puja', winner: L.high ? L.highName : '', amount: L.high || 0 };
    await update(ref(db), { 'auction/config/results': [...C.results, res], 'auction/config/last': { ...res, t },
      ...(done ? { 'auction/config/status': 'done' } : {}),
      'secret/word': next && next.mode === 'palabra' ? norm(words[next.id]) : null,
      'auction/live': { idx: done ? L.idx : L.idx + 1, high: 0, highName: '', highId: '', endsAt: t + 5000 + dur(next), bannerUntil: t + 5000 } });
  } catch (e) { $('#status').textContent = 'Error al cerrar la ronda: ' + (e.code || e.message); }
  finally { setTimeout(() => closing = false, 1500); }
}

function checkBanner() {
  const l = C && C.last; if (!l || l.t === lastBanner) return;
  lastBanner = l.t; if (now() - l.t > 6000) return;
  $('#mCard').textContent = l.card; $('#mWin').textContent = l.winner || 'Sin ganador'; $('#mAmt').textContent = l.winner ? fmt(l.amount) : '';
  $('#modal').classList.add('on'); setTimeout(() => $('#modal').classList.remove('on'), 4800);
}

/* ---------- Informe ---------- */
function resultsTable() {
  const r = C.results, total = r.reduce((a, x) => a + (x.winner ? x.amount : 0), 0);
  return `<table><tr><th>#</th><th>Carta</th><th>Ganador</th><th>Valor</th></tr>${r.map(x => `<tr><td>${x.n}</td><td>${esc(x.card)}${x.mode === 'palabra' ? ' 🔤' : ''}</td><td>${x.winner ? esc(x.winner) : '<span class="mu">Sin ganador</span>'}</td><td>${x.winner ? fmt(x.amount) : '—'}</td></tr>`).join('')}<tr><th colspan="3">Total recaudado</th><th>${fmt(total)}</th></tr></table>`;
}
const reportText = () => 'INFORME DE SUBASTA\n\n' + C.results.map(x => `${x.n}. ${x.card} → ${x.winner ? x.winner + ' por ' + fmt(x.amount) : 'sin ganador'}`).join('\n') + '\n\nTotal: ' + fmt(C.results.reduce((a, x) => a + (x.winner ? x.amount : 0), 0));
function renderReport() {
  const el = $('#report');
  if (!isAdmin || C.status !== 'done') { el.innerHTML = ''; el.dataset.n = ''; return; }
  if (el.dataset.n === String(C.results.length)) return;
  el.dataset.n = String(C.results.length);
  el.innerHTML = `<div class="card"><h2>📋 Informe para el subastador</h2>${resultsTable()}<div class="row" style="margin-top:12px"><button id="dl">Descargar informe</button><button class="sec" id="cp">Copiar texto</button></div></div>`;
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(reportText()); $('#cp').textContent = '¡Copiado!'; } catch (e) {} };
  $('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([reportText()], { type: 'text/plain' })); a.download = 'informe-subasta.txt'; a.click(); };
}
</script>
</body>
