<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subasta de cartas</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1b16;--mu:#6e695d;--bd:#ddd8cb;--ac:#b4472b;--ac2:#8a3320;--ok:#2d7a4b;--wn:#c98a00}
@media (prefers-color-scheme:dark){:root{--bg:#17150f;--card:#222018;--tx:#f1ede2;--mu:#a29c8b;--bd:#3a362a;--ac:#e0704f;--ac2:#f08a6a;--ok:#5fc283;--wn:#e8b23a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0 .1em}h2{font-size:1.1rem;margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}a{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,button,select{font:inherit;color:var(--tx)}
input[type=text],input[type=number],input[type=password],select{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;min-width:0}
button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:600}
button:hover{background:var(--ac2)}button:disabled{opacity:.45;cursor:not-allowed}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.sm{padding:5px 10px;font-size:.85rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.main-img{width:100%;aspect-ratio:3/4;max-height:460px;object-fit:contain;background:var(--bg);border-radius:10px;border:1px solid var(--bd)}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:7px;border:2px solid transparent;cursor:pointer}
.thumbs img.on{border-color:var(--ac)}
.price{font-size:2.4rem;font-weight:800;color:var(--ac)}
.timer{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ok);width:100%}
.log{max-height:190px;overflow-y:auto;border-top:1px solid var(--bd);margin-top:10px}
.log div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid var(--bd)}
.log div:first-child{font-weight:700;color:var(--ok)}
.adm-card{display:grid;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px}
.imgs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.imgs span{position:relative}
.imgs img{width:48px;height:48px;object-fit:cover;border-radius:7px}
.imgs b{position:absolute;top:-6px;right:-6px;background:var(--ac);color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;font-size:.7rem;line-height:18px;cursor:pointer}
.lbl{font-size:.8rem;color:var(--mu);display:block}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd)}
.mem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.modal>div{background:var(--card);border-radius:18px;padding:28px;text-align:center;max-width:420px;width:100%;border:3px solid var(--ac)}
.modal .w{font-size:1.8rem;font-weight:800;margin:8px 0}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <h1>🃏 Subasta de cartas</h1>
  <div id="status" class="mu">Conectando…</div>
  <div id="err" class="mu" style="color:var(--ac)"></div>
  <div id="menu"></div>
  <div id="app" class="hide">
    <div id="admin"></div><div id="members"></div><div id="live"></div><div id="mine"></div><div id="report"></div>
  </div>
</main>
<div class="modal" id="modal"><div><div class="mu">Ronda terminada</div><div class="w" id="mCard"></div><div>Ganador</div><div class="w" id="mWin" style="color:var(--ok)"></div><div class="price" id="mAmt"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, set, update, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyB9gq6dFliBmXep4AxXQBH-IB9MjPdZL2s",
  authDomain: "subastas-d3872.firebaseapp.com",
  databaseURL: "https://subastas-d3872-default-rtdb.firebaseio.com",
  projectId: "subastas-d3872",
  storageBucket: "subastas-d3872.firebasestorage.app",
  messagingSenderId: "14103613295",
  appId: "1:14103613295:web:d5f3394abbdac55e66629a"
});
const auth = getAuth(app), db = getDatabase(app);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => '$' + Number(n || 0).toLocaleString('es-AR');
const arr = v => v ? (Array.isArray(v) ? v.filter(Boolean) : Object.values(v)) : [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Math.random().toString(36).slice(2, 10);
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
let offset = 0; const now = () => Date.now() + offset;

let user = null, myId = null, room = '', meta, C = null, L = null, players = [], imgs = {}, words = {}, myBids = {}, myRooms = [];
let playersLoaded = false, wordsOn = false, unsubs = [], sel = new Set(), bv = { min: '', step: '' }, progText = '';
let adT = 0, imgIdx = 0, lastBanner = 0, closing = false, myName = '';
try { myName = localStorage.getItem('sub_name') || ''; } catch (e) {}

const P = p => 'rooms/' + room + '/' + p;
const link = id => location.origin + location.pathname + '#sala=' + id;
const adm = () => !!(user && !user.isAnonymous && meta && meta.owner === user.uid);
const me = () => players.find(p => p.id === myId);
const st = () => ({ bidSecs: 10, pauseSecs: 5, wordSecs: 30, ...((C && C.settings) || {}) });
const dur = c => ((c && c.mode === 'palabra') ? (+c.secs || st().wordSecs) : st().bidSecs) * 1000;
const cardImgs = id => imgs[id] || [];
const err = e => { $('#err').textContent = 'Error: ' + (e.code || e.message) + ' (revisá las reglas de Firebase)'; };

onValue(ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });

/* ---------- Sesión, sala y suscripciones ---------- */
function resub() {
  unsubs.forEach(f => f()); unsubs = []; meta = undefined; C = L = null; players = []; imgs = {}; words = {}; myBids = {}; myRooms = []; playersLoaded = wordsOn = false;
  for (const s of ['#live', '#members', '#report', '#mine', '#admin']) { $(s).dataset.idx = ''; $(s).dataset.sig = ''; $(s).dataset.n = ''; }
  room = (location.hash.match(/sala=([\w-]+)/) || [])[1] || '';
  if (room) {
    unsubs.push(onValue(ref(db, P('meta')), s => {
      meta = s.val();
      if (adm() && !wordsOn) { wordsOn = true; unsubs.push(onValue(ref(db, P('secret/words')), w => { words = w.val() || {}; render(); }, err)); }
      render();
    }, err));
    if (user) {
      unsubs.push(onValue(ref(db, P('config')), s => { const v = s.val() || {}; C = { status: 'setup', ...v, cards: arr(v.cards), results: arr(v.results) }; render(); }, err));
      unsubs.push(onValue(ref(db, P('live')), s => { const v = s.val() || {}; L = { idx: 0, high: 0, highName: '', highId: '', endsAt: 0, bannerUntil: 0, ...v, bids: arr(v.bids) }; render(); }, err));
      unsubs.push(onValue(ref(db, P('players')), s => { const v = s.val() || {}; players = Object.entries(v).map(([id, p]) => ({ id, ...p })).sort((a, b) => (a.t || 0) - (b.t || 0)); playersLoaded = true; render(); }, err));
      unsubs.push(onValue(ref(db, P('images')), s => { const v = s.val() || {}; imgs = {}; for (const [cid, o] of Object.entries(v)) imgs[cid] = Object.entries(o || {}).map(([id, url]) => ({ id, url })); render(); }, err));
      unsubs.push(onValue(ref(db, P('bids/' + user.uid)), s => { myBids = s.val() || {}; render(); }, err));
    }
  } else if (user && !user.isAnonymous) {
    unsubs.push(onValue(ref(db, 'users/' + user.uid + '/rooms'), s => { myRooms = Object.entries(s.val() || {}).map(([id, r]) => ({ id, ...r })).sort((a, b) => (b.t || 0) - (a.t || 0)); render(); }, err));
  }
  render();
}
onAuthStateChanged(auth, u => { user = u; myId = u ? u.uid : null; resub(); });
addEventListener('hashchange', resub);
setInterval(() => tick(), 250);

async function logout() {
  if (!adm() && me()) { try { await remove(ref(db, P('players/' + myId))); } catch (e) {} }
  await signOut(auth);
}

/* ---------- Pantallas de entrada ---------- */
function screen(key, html, wire) {
  $('#app').classList.add('hide'); const m = $('#menu'); m.classList.remove('hide');
  if (m.dataset.k !== key) { m.dataset.k = key; m.innerHTML = html; wire && wire(); }
}
const authCard = (create, title) => `<div class="card"><h2>🎤 ${title}</h2><div class="mu">${create ? 'Entrá o creá tu cuenta para armar tus propias salas.' : 'Iniciá sesión con tu cuenta de subastador.'}</div>
  <div class="grid" style="margin-top:10px;gap:8px"><input type="text" id="ae" placeholder="Email" autocomplete="username"><input type="password" id="ap" placeholder="Contraseña (mín. 6)" autocomplete="current-password"></div>
  <div class="row" style="margin-top:10px"><button id="ain">Iniciar sesión</button>${create ? '<button id="acr" class="sec">Crear cuenta</button>' : ''}</div><div class="mu" id="amsg"></div></div>`;
function wireAuth() {
  const run = async mk => {
    const msg = $('#amsg'); msg.textContent = 'Verificando…';
    try { await (mk ? createUserWithEmailAndPassword : signInWithEmailAndPassword)(auth, $('#ae').value.trim(), $('#ap').value); }
    catch (x) { const c = x.code || ''; msg.textContent = /invalid-credential|wrong-password|user-not-found/.test(c) ? 'Email o contraseña incorrectos.' : /email-already/.test(c) ? 'Ese email ya tiene cuenta: usá Iniciar sesión.' : /weak/.test(c) ? 'La contraseña debe tener al menos 6 caracteres.' : /invalid-email/.test(c) ? 'Email inválido.' : 'No se pudo entrar: ' + c; }
  };
  $('#ain').onclick = () => run(false); if ($('#acr')) $('#acr').onclick = () => run(true);
  $('#ap').addEventListener('keydown', e => { if (e.key === 'Enter') run(false); });
}

function showHome() {
  const li = user && !user.isAnonymous;
  $('#status').textContent = li ? 'Cuenta: ' + user.email : '';
  screen('home' + (li ? 1 : 0), li
    ? `<div class="card"><h2>Mis salas</h2><div id="rl"></div></div><div class="card"><h2>Crear sala nueva</h2><div class="row"><input type="text" id="rn" placeholder="Nombre de la sala" maxlength="40" style="flex:1"><button id="rc">Crear sala</button></div><div class="mu" id="rmsg"></div></div><button class="sec sm" id="so">Cerrar sesión</button>`
    : `<div class="grid">${authCard(true, 'Soy subastador')}<div class="card"><h2>🙋 Soy pujador</h2><div class="mu">Abrí el link de la sala que te pasó el subastador y entrá con tu usuario. Podés sumarte aunque la subasta ya haya empezado.</div></div></div>`,
    () => {
      if (!li) return wireAuth();
      $('#so').onclick = () => signOut(auth);
      $('#rc').onclick = async () => {
        const id = uid(), name = ($('#rn').value || '').trim() || 'Mi sala';
        try { await set(ref(db, 'rooms/' + id + '/meta'), { owner: user.uid, name, t: now() }); await set(ref(db, 'users/' + user.uid + '/rooms/' + id), { name, t: now() }); location.hash = 'sala=' + id; }
        catch (e) { $('#rmsg').textContent = 'No se pudo crear: ' + (e.code || e.message); }
      };
    });
  if (li && $('#rl')) $('#rl').innerHTML = myRooms.length ? myRooms.map(r => `<div class="mem"><span><b>${esc(r.name)}</b><br><span class="mu">${esc(link(r.id))}</span></span><span class="row"><button class="sec sm" data-copy="${r.id}">Copiar link</button><button class="sm" data-open="${r.id}">Abrir</button></span></div>`).join('') : '<div class="mu">Todavía no creaste ninguna sala.</div>';
}
$('#menu').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'), c = e.target.closest('[data-copy]');
  if (o) location.hash = 'sala=' + o.dataset.open;
  if (c) { try { navigator.clipboard.writeText(link(c.dataset.copy)); c.textContent = '¡Copiado!'; } catch (x) {} }
});

function showJoin() {
  screen('join' + room, `<div class="card"><h2>🏷 ${esc(meta.name)}</h2><div class="mu">Entrá con un usuario. Si ya participaste en esta sala desde este dispositivo, seguís donde quedaste.</div></div>
    <div class="grid"><div class="card"><h2>🙋 Entrar como pujador</h2><div class="row" style="margin-top:10px"><input type="text" id="mnm" placeholder="Tu usuario" maxlength="24" value="${esc(myName)}" style="flex:1"><button id="mgo">Entrar</button></div><div class="mu" id="mmsg"></div></div>
    ${authCard(false, 'Soy el subastador de esta sala')}</div>`, () => {
    wireAuth();
    const go = () => join($('#mnm').value, $('#mmsg'));
    $('#mgo').onclick = go; $('#mnm').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });
}

async function join(name, msg) {
  name = (name || '').trim();
  if (!name) { msg.textContent = 'Escribí un usuario.'; return false; }
  msg.textContent = 'Entrando…';
  try { if (!auth.currentUser) await signInAnonymously(auth); } catch (e) { msg.textContent = 'No se pudo conectar: ' + (e.code || e.message); return false; }
  myId = auth.currentUser.uid;
  for (let i = 0; i < 80 && !(playersLoaded && user); i++) await sleep(100);
  if (!playersLoaded) { msg.textContent = 'Sin conexión con la base de datos. Revisá las reglas de Firebase.'; return false; }
  if (players.some(p => p.id !== myId && (p.name || '').toLowerCase() === name.toLowerCase())) { msg.textContent = 'Ese usuario ya está en uso, elegí otro.'; return false; }
  try { await set(ref(db, P('players/' + myId)), { name, t: now() }); }
  catch (e) { msg.textContent = 'No se pudo entrar: ' + (e.code || e.message); return false; }
  if (!me()) players.push({ id: myId, name, t: now() });
  myName = name; try { localStorage.setItem('sub_name', name); } catch (x) {}
  render(); return true;
}

/* ---------- Render general ---------- */
function render() {
  if (!room) { showHome(); return; }
  if (meta === undefined) { $('#app').classList.add('hide'); $('#menu').classList.add('hide'); $('#status').textContent = 'Cargando sala…'; return; }
  if (meta === null) { $('#app').classList.add('hide'); $('#menu').classList.add('hide'); $('#status').innerHTML = 'Esa sala no existe. Revisá el link o <a href="#" id="gh">volvé al inicio</a>.'; $('#gh').onclick = e => { e.preventDefault(); location.hash = ''; }; return; }
  if (!user || (!adm() && playersLoaded && !me())) { $('#status').textContent = ''; showJoin(); return; }
  if (!C || !L || (!adm() && !playersLoaded)) return;
  $('#menu').classList.add('hide'); $('#menu').dataset.k = ''; $('#app').classList.remove('hide');
  $('#status').innerHTML = (adm() ? 'Modo subastador' : 'Pujás como <b>' + esc(me().name) + '</b>') + ' · Sala <b>' + esc(meta.name) + '</b>' + (adm() ? ' · <a href="#" id="back">Mis salas</a>' : '') + ' · <a href="#" id="logout">Salir</a>';
  $('#logout').onclick = ev => { ev.preventDefault(); logout(); };
  if ($('#back')) $('#back').onclick = ev => { ev.preventDefault(); location.hash = ''; };
  if (adm()) {
    $('#admin').classList.remove('hide');
    const sig = JSON.stringify([C.cards, C.status, C.settings, Object.fromEntries(Object.entries(imgs).map(([k, v]) => [k, v.map(m => m.id)])), words, progText]);
    if (sig !== $('#admin').dataset.sig) { $('#admin').dataset.sig = sig; clearTimeout(adT); adT = setTimeout(renderAdmin, 300); }
  } else $('#admin').classList.add('hide');
  renderMembers(); renderLive(); renderMine(); renderReport(); checkBanner();
}

/* ---------- Subastador ---------- */
const setCards = cards => set(ref(db, P('config/cards')), cards);
const cloneCards = () => C.cards.map(c => ({ ...c }));

function renderAdmin() {
  if (!C || !adm()) return;
  const el = $('#admin'), setup = C.status === 'setup', s = st();
  let h = `<div class="card"><h2>🔗 Link de tu sala</h2><div class="row"><input type="text" readonly value="${esc(link(room))}" style="flex:1;min-width:200px"><button class="sec" data-act="copy">Copiar</button></div><div class="mu">Los pujadores pueden entrar con este link en cualquier momento, incluso con la subasta empezada.</div></div>
  <div class="card"><h2>⏱ Tiempos (segundos)</h2><div class="row">${[['bidSecs', 'Cada puja (se reinicia al pujar)', 3], ['pauseSecs', 'Espera entre cartas', 2], ['wordSecs', 'Cartas de palabra (por defecto)', 5]].map(([k, l, m]) => `<label><span class="lbl">${l}</span><input type="number" min="${m}" value="${s[k]}" data-s="${k}" data-m="${m}" style="width:110px"></label>`).join('')}</div></div>
  <div class="card"><h2>Panel del subastador</h2>`;
  if (setup) {
    h += `<div class="adm-card"><b>Carga y edición en lote</b>
      <div class="row"><label><span class="lbl">Precio mínimo</span><input type="number" min="0" id="bmin" placeholder="sin cambio" value="${esc(bv.min)}" style="width:120px"></label>
      <label><span class="lbl">Puja mínima</span><input type="number" min="1" id="bstep" placeholder="sin cambio" value="${esc(bv.step)}" style="width:120px"></label></div>
      <div class="row"><button class="sec sm" data-act="selall">Marcar todas</button><button class="sec sm" data-act="selnone">Desmarcar</button><button class="sm" data-act="bapply">Aplicar a <span id="selc">${sel.size}</span> marcadas</button><button class="sec sm" data-act="bdel">Quitar marcadas</button></div>
      <label class="lbl">📷 Cargar muchas fotos de una vez: se crea una carta por foto, con el precio y la puja de arriba (o 100 y 10) <input type="file" accept="image/*" multiple data-act="batch"></label><div class="mu" id="prog">${esc(progText)}</div></div>`;
    C.cards.forEach((c, i) => {
      const im = cardImgs(c.id), w = c.mode === 'palabra';
      h += `<div class="adm-card"><div class="row"><input type="checkbox" data-sel="${esc(c.id)}" ${sel.has(c.id) ? 'checked' : ''}><b>#${i + 1}</b>
        <input type="text" value="${esc(c.name)}" placeholder="Nombre de la carta" data-f="name" data-i="${i}" style="flex:1;min-width:140px">
        <button class="sec sm" data-act="up" data-i="${i}">↑</button><button class="sec sm" data-act="dn" data-i="${i}">↓</button><button class="sec sm" data-act="del" data-i="${i}">Quitar</button></div>
        <div class="row"><label><span class="lbl">Tipo</span><select data-f="mode" data-i="${i}"><option value="puja" ${w ? '' : 'selected'}>Subasta por puja</option><option value="palabra" ${w ? 'selected' : ''}>Gana el primero que escriba una palabra</option></select></label>
        <label><span class="lbl">${w ? 'Precio que paga el ganador' : 'Precio mínimo'}</span><input type="number" min="0" value="${c.min}" data-f="min" data-i="${i}" style="width:110px"></label>
        ${w ? `<label><span class="lbl">Palabra secreta</span><input type="text" value="${esc(words[c.id] || '')}" data-f="word" data-i="${i}" style="width:150px"></label><label><span class="lbl">Tiempo límite (seg)</span><input type="number" min="5" value="${c.secs || ''}" placeholder="${s.wordSecs}" data-f="secs" data-i="${i}" style="width:100px"></label>` : `<label><span class="lbl">Puja mínima</span><input type="number" min="1" value="${c.step}" data-f="step" data-i="${i}" style="width:110px"></label>`}</div>
        <div class="imgs">${im.slice(0, 4).map(m => `<span><img src="${esc(m.url)}" alt=""><b data-act="rmimg" data-i="${i}" data-k="${esc(m.id)}">×</b></span>`).join('')}${im.length > 4 ? `<span class="mu">+${im.length - 4} fotos</span>` : ''}${im.length ? '' : '<span class="mu">Sin fotos</span>'}</div>
        <label class="lbl">Agregar fotos (varias a la vez) <input type="file" accept="image/*" multiple data-act="upload" data-i="${i}"></label></div>`;
    });
    h += `<div class="row" style="margin-top:12px"><button data-act="add">+ Agregar carta</button><button data-act="start" ${C.cards.length ? '' : 'disabled'} style="background:var(--ok)">▶ Iniciar subasta</button></div>`;
  } else h += `<div class="row"><span>Subasta ${C.status === 'running' ? 'en curso' : 'finalizada'}.</span><button class="sec" data-act="reset">Reiniciar todo (volver a cargar cartas)</button></div>`;
  el.innerHTML = h + '</div>';
}

function shrink(file, max = 640) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.7)); };
    img.onerror = rej; img.src = u;
  });
}
function setProg(t) { progText = t; const p = $('#prog'); if (p) p.textContent = t; }

async function batchUpload(files) {
  const list = [...files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  const nc = list.map(f => ({ id: uid(), name: f.name.replace(/\.[^.]+$/, ''), mode: 'puja', min: +bv.min || 100, step: +bv.step || 10 }));
  await setCards([...cloneCards(), ...nc]);
  const q = list.map((f, i) => [f, nc[i].id]); let done = 0; setProg(`Subiendo fotos… 0/${list.length}`);
  const worker = async () => { while (q.length) { const [f, cid] = q.shift(); try { await set(ref(db, P(`images/${cid}/${uid()}`)), await shrink(f)); } catch (e) { err(e); } setProg(`Subiendo fotos… ${++done}/${list.length}`); } };
  await Promise.all([worker(), worker(), worker()]); setProg(`Listo: ${done} fotos subidas.`);
}

$('#admin').addEventListener('input', e => { if (e.target.id === 'bmin') bv.min = e.target.value; if (e.target.id === 'bstep') bv.step = e.target.value; });
$('#admin').addEventListener('change', async e => {
  const t = e.target, i = +t.dataset.i;
  if (t.dataset.sel) { t.checked ? sel.add(t.dataset.sel) : sel.delete(t.dataset.sel); $('#selc').textContent = sel.size; return; }
  if (t.dataset.s) { await set(ref(db, P('config/settings')), { ...st(), [t.dataset.s]: Math.max(+t.dataset.m, +t.value || 0) }); return; }
  if (t.dataset.f === 'word') { await set(ref(db, P('secret/words/' + C.cards[i].id)), t.value.trim()); return; }
  if (t.dataset.f) { const f = t.dataset.f, cards = cloneCards(); cards[i][f] = (f === 'name' || f === 'mode') ? t.value : Math.max(0, +t.value || 0); await setCards(cards); return; }
  if (t.dataset.act === 'batch') { t.disabled = true; await batchUpload(t.files); return; }
  if (t.dataset.act === 'upload') {
    const cid = C.cards[i].id; t.disabled = true;
    for (const f of t.files) { try { await set(ref(db, P(`images/${cid}/${uid()}`)), await shrink(f)); } catch (x) { err(x); } }
  }
});
$('#admin').addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t || t.tagName === 'INPUT') return;
  const a = t.dataset.act, i = +t.dataset.i, cards = cloneCards();
  const arm = (txt, back) => { if (t.dataset.armed) return true; t.dataset.armed = 1; t.textContent = txt; setTimeout(() => { delete t.dataset.armed; t.textContent = back; }, 4000); return false; };
  if (a === 'copy') { try { await navigator.clipboard.writeText(link(room)); t.textContent = '¡Copiado!'; } catch (x) {} }
  if (a === 'add') { cards.push({ id: uid(), name: '', mode: 'puja', min: +bv.min || 100, step: +bv.step || 10 }); await setCards(cards); }
  if (a === 'del') { const [x] = cards.splice(i, 1); sel.delete(x.id); await setCards(cards); remove(ref(db, P('images/' + x.id))); remove(ref(db, P('secret/words/' + x.id))); }
  if (a === 'up' && i > 0) { [cards[i - 1], cards[i]] = [cards[i], cards[i - 1]]; await setCards(cards); }
  if (a === 'dn' && i < cards.length - 1) { [cards[i + 1], cards[i]] = [cards[i], cards[i + 1]]; await setCards(cards); }
  if (a === 'rmimg') await remove(ref(db, P(`images/${cards[i].id}/${t.dataset.k}`)));
  if (a === 'selall') { cards.forEach(c => sel.add(c.id)); renderAdmin(); }
  if (a === 'selnone') { sel.clear(); renderAdmin(); }
  if (a === 'bapply') {
    if (!sel.size) { setProg('Marcá primero las cartas.'); return; }
    cards.forEach(c => { if (sel.has(c.id)) { if (bv.min !== '') c.min = Math.max(0, +bv.min); if (bv.step !== '') c.step = Math.max(1, +bv.step); } });
    await setCards(cards); setProg(`Valores aplicados a ${sel.size} cartas.`);
  }
  if (a === 'bdel') {
    if (!sel.size || !arm('¿Seguro? Tocá de nuevo', 'Quitar marcadas')) return;
    const keep = cards.filter(c => !sel.has(c.id)); for (const id of sel) { remove(ref(db, P('images/' + id))); remove(ref(db, P('secret/words/' + id))); }
    sel.clear(); await setCards(keep);
  }
  if (a === 'start') {
    cards.forEach((c, k) => { if (!c.name.trim()) c.name = 'Carta ' + (k + 1); });
    const bad = cards.find(c => c.mode === 'palabra' && !norm(words[c.id]));
    if (bad) { alert('Falta definir la palabra secreta de: ' + (bad.name || 'una carta')); return; }
    await update(ref(db), { [P('config/cards')]: cards, [P('config/status')]: 'running', [P('config/results')]: null, [P('config/last')]: null,
      [P('secret/word')]: cards[0].mode === 'palabra' ? norm(words[cards[0].id]) : null,
      [P('live')]: { idx: 0, high: 0, highName: '', highId: '', endsAt: now() + dur(cards[0]), bannerUntil: 0 } });
  }
  if (a === 'reset') {
    if (!arm('¿Seguro? Tocá de nuevo para confirmar', 'Reiniciar todo (volver a cargar cartas)')) return;
    await update(ref(db), { [P('config/status')]: 'setup', [P('config/results')]: null, [P('config/last')]: null, [P('secret/word')]: null, [P('live')]: { idx: 0, high: 0, highName: '', highId: '', endsAt: 0, bannerUntil: 0 } });
  }
});

function renderMembers() {
  const el = $('#members');
  if (!adm()) { el.innerHTML = ''; el.dataset.sig = ''; return; }
  const sig = JSON.stringify(players.map(p => [p.id, p.name]));
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  el.innerHTML = `<div class="card"><h2>👥 Integrantes (${players.length})</h2>` + (players.length
    ? players.map(p => `<div class="mem"><span>👤 ${esc(p.name)}</span><button class="sec sm" data-kick="${esc(p.id)}">Eliminar</button></div>`).join('')
    : '<div class="mu">Todavía no entró nadie.</div>') + '</div>';
}
$('#members').addEventListener('click', e => {
  const b = e.target.closest('[data-kick]'); if (!b) return;
  if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = '¿Seguro?'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Eliminar'; } }, 3000); return; }
  remove(ref(db, P('players/' + b.dataset.kick)));
});

/* ---------- Vista en vivo ---------- */
const cur = () => C.cards[L.idx];
const minBid = () => L.high ? L.high + (+cur().step || 1) : (+cur().min || 0);

function renderLive() {
  const el = $('#live');
  if (C.status === 'setup') {
    if (el.dataset.idx !== 'lobby') { el.dataset.idx = 'lobby'; el.innerHTML = `<div class="card"><h2>🚪 Sala de espera</h2><div id="lmsg2"></div><h2 style="margin-top:16px">Participantes (<span id="lcnt"></span>)</h2><div id="plist"></div></div>`; }
    $('#lmsg2').textContent = adm() ? 'Esperá a que entren los participantes y tocá Iniciar subasta cuando estén listos.' : 'Estás dentro. Esperá a que el subastador inicie la subasta.';
    $('#lcnt').textContent = players.length;
    $('#plist').innerHTML = players.length ? players.map(p => `<div class="mem"><span>👤 ${esc(p.name)}${p.id === myId ? ' <span class="mu">(vos)</span>' : ''}</span></div>`).join('') : '<div class="mu">Todavía no entró nadie.</div>';
    return;
  }
  if (C.status === 'done') { el.dataset.idx = 'done'; el.innerHTML = `<div class="card"><h2>🏁 Subasta finalizada</h2><div class="mu">Gracias por participar.</div>${resultsTable()}</div>`; return; }
  const c = cur(); if (!c) return;
  const im = cardImgs(c.id);
  if (imgIdx >= im.length) imgIdx = 0;
  const key = L.idx + '|' + (c.mode || '') + '|' + im.map(m => m.id).join(',') + '|' + imgIdx;
  if (el.dataset.idx !== key) {
    el.dataset.idx = key;
    el.innerHTML = `<div class="card"><div class="mu">Carta ${L.idx + 1} de ${C.cards.length}</div><h2 style="font-size:1.4rem">${esc(c.name)}</h2>
    <div class="grid"><div>${im.length ? `<img class="main-img" src="${esc(im[imgIdx].url)}" alt="">` : `<div class="main-img" style="display:flex;align-items:center;justify-content:center">Sin foto</div>`}
      <div class="thumbs">${im.map((m, k) => `<img src="${esc(m.url)}" class="${k === imgIdx ? 'on' : ''}" data-k="${k}" alt="">`).join('')}</div></div>
    <div>
      <div class="mu">${c.mode === 'palabra' ? 'Gana el primero que escriba la palabra · Precio ' + fmt(c.min) : 'Precio mínimo ' + fmt(c.min) + ' · Puja mínima +' + fmt(c.step)}</div>
      <div class="mu" style="margin-top:8px">${c.mode === 'palabra' ? 'Ganador' : 'Puja más alta'}</div><div class="price" id="hp"></div><div id="hn" class="mu"></div>
      <div class="timer" id="tm"></div><div class="bar"><i id="tb"></i></div>
      <div id="bidbox"></div><div class="log" id="log"></div>
    </div></div></div>`;
    el.querySelector('.thumbs').addEventListener('click', e => { const k = e.target.dataset.k; if (k !== undefined) { imgIdx = +k; el.dataset.idx = ''; renderLive(); } });
  }
  if (c.mode === 'palabra') { $('#hp').textContent = L.winnerName ? '🏆 ' + L.winnerName : '—'; $('#hn').textContent = L.winnerName ? 'Se lleva la carta' + (L.winnerId === myId ? ' (¡fuiste vos!)' : '') : 'Aún nadie acertó'; }
  else { $('#hp').textContent = L.high ? fmt(L.high) : '—'; $('#hn').textContent = L.high ? 'de ' + L.highName + (L.highId === myId ? ' (vos)' : '') : 'Aún sin pujas'; }
  $('#log').innerHTML = L.bids.map(b => `<div><span>${esc(b.name)}</span><span>${fmt(b.amount)}</span></div>`).join('');
  renderBidBox();
}

function renderBidBox() {
  const box = $('#bidbox'); if (!box) return;
  if (cur().mode === 'palabra') {
    if (adm()) { box.innerHTML = `<div class="mu">Modo subastador. Palabra secreta: <b>${esc(words[cur().id] || '(sin definir)')}</b></div>`; return; }
    if (!box.dataset.ok) {
      box.dataset.ok = 1;
      box.innerHTML = `<div class="mu">Escribí la palabra correcta. El primero en acertar se lleva la carta.</div><div class="row" style="margin-top:8px"><input type="text" id="wd" placeholder="La palabra…" style="flex:1" autocomplete="off"><button id="wgo">Enviar</button></div><div class="mu" id="msg"></div>`;
      $('#wgo').onclick = guessWord; $('#wd').addEventListener('keydown', e => { if (e.key === 'Enter') guessWord(); });
    }
    $('#wgo').disabled = $('#wd').disabled = !!L.winnerId;
    return;
  }
  if (adm()) { if (!box.dataset.adm) { box.dataset.adm = 1; box.innerHTML = '<div class="mu">Modo subastador: seguís la subasta en vivo.</div>'; } return; }
  const mb = minBid();
  if (!box.dataset.ok) {
    box.dataset.ok = 1;
    box.innerHTML = `<div class="row"><input type="number" id="amt" style="flex:1" inputmode="numeric"><button id="go">Pujar</button></div>
      <div class="row" style="margin-top:8px"><button class="sec sm" id="quick"></button></div><div class="mu" id="msg"></div>`;
    $('#go').onclick = () => bid(+$('#amt').value);
    $('#quick').onclick = () => bid(minBid());
    $('#amt').addEventListener('keydown', e => { if (e.key === 'Enter') bid(+e.target.value); });
  }
  const amt = $('#amt'); amt.min = mb; amt.placeholder = 'Mínimo ' + mb;
  if (document.activeElement !== amt && (!amt.value || +amt.value < mb)) amt.value = mb;
  $('#quick').textContent = 'Pujar mínimo ' + fmt(mb);
}

async function bid(v) {
  const msg = $('#msg'), idx = L.idx, c = cur(), name = me().name;
  if (!(v >= minBid())) { msg.textContent = 'La puja debe ser de al menos ' + fmt(minBid()); return; }
  msg.textContent = '';
  try {
    const r = await runTransaction(ref(db, P('live')), cl => {
      if (!cl) return;
      const t = now(), need = cl.high ? cl.high + (+c.step || 1) : (+c.min || 0);
      if (cl.idx !== idx || t >= cl.endsAt || t < (cl.bannerUntil || 0) || v < need) return;
      return { ...cl, high: v, highName: name, highId: myId, bids: [{ name, amount: v }, ...arr(cl.bids)].slice(0, 30), endsAt: t + st().bidSecs * 1000 };
    });
    if (!r.committed) msg.textContent = 'No se pudo registrar: alguien pujó antes o la ronda cerró.';
    else set(ref(db, P(`bids/${myId}/${c.id}`)), { amount: v, t: now() });
  } catch (e) { msg.textContent = 'Error al pujar: ' + (e.code || e.message); }
}

async function guessWord() {
  const msg = $('#msg'), idx = L.idx, g = norm($('#wd').value), name = me().name;
  if (!g) return;
  try {
    const r = await runTransaction(ref(db, P('live')), cl => {
      if (!cl) return;
      const t = now();
      if (cl.idx !== idx || cl.winnerId || t >= cl.endsAt || t < (cl.bannerUntil || 0)) return;
      return { ...cl, winnerId: myId, winnerName: name, guess: g, endsAt: t };
    });
    msg.textContent = r.committed ? '' : 'No acertaste o alguien llegó antes.';
  } catch (e) { msg.textContent = /permission/i.test((e.code || '') + (e.message || '')) ? 'Esa no es la palabra. Probá de nuevo.' : 'Error: ' + (e.code || e.message); }
  if ($('#wd')) $('#wd').value = '';
}

/* ---------- Mis pujas (pujador) ---------- */
function renderMine() {
  const el = $('#mine');
  if (adm() || C.status === 'setup') { el.innerHTML = ''; el.dataset.sig = ''; return; }
  const rows = C.cards.map(c => {
    const b = myBids[c.id], r = C.results.find(x => x.cid === c.id), won = r && r.winnerId === myId;
    if (!b && !won) return '';
    let s = r ? (won ? '🏆 Ganada por ' + fmt(r.amount) : 'Perdida') : (C.status === 'running' && cur() && cur().id === c.id ? (L.highId === myId ? 'Vas ganando' : 'Te superaron') : 'Pendiente');
    return `<div class="mem"><span>${esc(c.name)}${b ? ` <span class="mu">· tu puja más alta ${fmt(b.amount)}</span>` : ''}</span><b>${s}</b></div>`;
  }).join('');
  const h = rows ? `<div class="card"><h2>📒 Mis pujas</h2>${rows}</div>` : '';
  if (el.dataset.sig !== h) { el.dataset.sig = h; el.innerHTML = h; }
}

/* ---------- Temporizador y cierre ---------- */
function tick() {
  if (!C || !L || !room || $('#app').classList.contains('hide')) return;
  const t = now(), tm = $('#tm'), tb = $('#tb');
  if (C.status === 'running' && tm) {
    if (t < L.bannerUntil) { tm.textContent = 'Próxima carta en ' + Math.ceil((L.bannerUntil - t) / 1000) + ' s'; tb.style.width = '0%'; }
    else { const left = Math.max(0, L.endsAt - t), tot = Math.max(1000, dur(cur())); tm.textContent = Math.ceil(left / 1000) + ' s'; tb.style.width = Math.min(100, left / tot * 100) + '%'; tb.style.background = left < 3500 ? 'var(--wn)' : 'var(--ok)'; }
  }
  if (adm() && C.status === 'running' && t >= L.endsAt && t >= L.bannerUntil && !closing) closeRound();
  checkBanner();
}

async function closeRound() {
  closing = true;
  try {
    const c = cur(), t = now(), pause = st().pauseSecs * 1000, done = L.idx + 1 >= C.cards.length, next = done ? null : C.cards[L.idx + 1], w = c.mode === 'palabra';
    const res = w ? { n: L.idx + 1, cid: c.id, card: c.name, mode: 'palabra', winner: L.winnerName || '', winnerId: L.winnerId || '', amount: L.winnerName ? (+c.min || 0) : 0 }
                  : { n: L.idx + 1, cid: c.id, card: c.name, mode: 'puja', winner: L.high ? L.highName : '', winnerId: L.high ? L.highId : '', amount: L.high || 0 };
    await update(ref(db), { [P('config/results')]: [...C.results, res], [P('config/last')]: { ...res, t },
      ...(done ? { [P('config/status')]: 'done' } : {}),
      [P('secret/word')]: next && next.mode === 'palabra' ? norm(words[next.id]) : null,
      [P('live')]: { idx: done ? L.idx : L.idx + 1, high: 0, highName: '', highId: '', endsAt: t + pause + dur(next), bannerUntil: t + pause } });
  } catch (e) { err(e); }
  finally { setTimeout(() => closing = false, 1500); }
}

function checkBanner() {
  const l = C && C.last; if (!l || l.t === lastBanner) return;
  lastBanner = l.t; const pause = st().pauseSecs * 1000; if (now() - l.t > pause + 1000) return;
  $('#mCard').textContent = l.card; $('#mWin').textContent = l.winner || 'Sin ganador'; $('#mAmt').textContent = l.winner ? fmt(l.amount) : '';
  $('#modal').classList.add('on'); setTimeout(() => $('#modal').classList.remove('on'), Math.max(1500, Math.min(4800, pause - 200)));
}

/* ---------- Informe ---------- */
function resultsTable() {
  const r = C.results, total = r.reduce((a, x) => a + (x.winner ? x.amount : 0), 0);
  return `<table><tr><th>#</th><th>Carta</th><th>Ganador</th><th>Valor</th></tr>${r.map(x => `<tr><td>${x.n}</td><td>${esc(x.card)}${x.mode === 'palabra' ? ' 🔤' : ''}</td><td>${x.winner ? esc(x.winner) : '<span class="mu">Sin ganador</span>'}</td><td>${x.winner ? fmt(x.amount) : '—'}</td></tr>`).join('')}<tr><th colspan="3">Total recaudado</th><th>${fmt(total)}</th></tr></table>`;
}
const reportText = () => 'INFORME DE SUBASTA - ' + meta.name + '\n\n' + C.results.map(x => `${x.n}. ${x.card} → ${x.winner ? x.winner + ' por ' + fmt(x.amount) : 'sin ganador'}`).join('\n') + '\n\nTotal: ' + fmt(C.results.reduce((a, x) => a + (x.winner ? x.amount : 0), 0));
function renderReport() {
  const el = $('#report');
  if (!adm() || C.status !== 'done') { el.innerHTML = ''; el.dataset.n = ''; return; }
  if (el.dataset.n === String(C.results.length)) return;
  el.dataset.n = String(C.results.length);
  el.innerHTML = `<div class="card"><h2>📋 Informe para el subastador</h2>${resultsTable()}<div class="row" style="margin-top:12px"><button id="dl">Descargar informe</button><button class="sec" id="cp">Copiar texto</button></div></div>`;
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(reportText()); $('#cp').textContent = '¡Copiado!'; } catch (e) {} };
  $('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([reportText()], { type: 'text/plain' })); a.download = 'informe-subasta.txt'; a.click(); };
}
</script>
